name: Deploy to Production VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-to-oracle-vm:
    name: Deploy to Oracle Ampere VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Oracle VM Secrets Availability
        id: secret-guard
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          if [ -z "$ORACLE_HOST" ] || [ -z "$ORACLE_SSH_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment Skipped::Oracle VM credentials (ORACLE_HOST and/or ORACLE_SSH_KEY) are not set in GitHub repository secrets. Automatic VM deployment skipped gracefully."
            echo "Oracle VM host credentials not configured; skipping automatic deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Oracle VM credentials present. Proceeding with deployment."
          fi

      - name: Deploy via SSH to Oracle VM
        if: steps.secret-guard.outputs.configured == 'true'
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_USER: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$ORACLE_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$ORACLE_PORT" "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_rsa -p "$ORACLE_PORT" "$ORACLE_USER@$ORACLE_HOST" << 'EOF'
            set -euo pipefail
            echo "===> Navigating to repository root..."
            cd ~/logistics-forecasting-platform

            echo "===> Pulling latest changes from main..."
            git fetch origin main
            git checkout main
            git pull origin main

            echo "===> Rebuilding and restarting updated containers..."
            docker compose up -d --build

            echo "===> Waiting for containers to stabilize..."
            sleep 15

            echo "===> Verifying service health..."
            docker compose ps
            curl --fail --retry 10 --retry-delay 3 http://localhost/health
            echo "===> Deployment successfully verified!"
          EOF
