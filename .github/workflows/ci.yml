name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Black Code Format Check
        run: |
          black --check .

      - name: Run Tests with Pytest
        run: |
          pytest
