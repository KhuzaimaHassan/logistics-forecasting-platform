name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras

      - name: Run Ruff Lint
        run: |
          uv run ruff check .

      - name: Run Black Code Format Check
        run: |
          uv run black --check .

      - name: Run Tests with Pytest
        run: |
          uv run pytest

  docker-compose-validate:
    name: Docker Compose Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Compose fails fast without credentials
        run: |
          OUTPUT=$(docker compose config 2>&1 || true)
          echo "Output when no credentials supplied:"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "POSTGRES_PASSWORD must be set"

      - name: Build all Docker images
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --env-file .env.ci build

      - name: Start Docker Compose stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --env-file .env.ci up -d

      - name: Wait for services to stabilize and report status
        run: |
          sleep 20
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --env-file .env.ci ps

      - name: Verify Caddy reverse proxy to FastAPI /health
        run: |
          curl --fail --retry 15 --retry-delay 2 http://localhost/health

      - name: Verify Caddy reverse proxy to Streamlit UI
        run: |
          curl --fail --retry 15 --retry-delay 2 http://localhost/

      - name: Direct container health probe for FastAPI
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --env-file .env.ci exec -T fastapi python -c "import urllib.request; assert urllib.request.urlopen('http://localhost:8000/health').getcode() == 200"

      - name: Direct container health probe for Streamlit
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --env-file .env.ci exec -T streamlit python -c "import urllib.request; assert urllib.request.urlopen('http://localhost:8501').getcode() == 200"

      - name: Confirm Feast imports inside serving, orchestration, and transform images
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --env-file .env.ci run --rm fastapi python -c "import feast; print(f'FastAPI Feast version: {feast.__version__}')"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --env-file .env.ci run --rm prefect-worker python -c "import feast; print(f'Prefect-Worker Feast version: {feast.__version__}')"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --env-file .env.ci run --rm stream-consumer python -c "import feast; print(f'Stream-Consumer Feast version: {feast.__version__}')"


      - name: Set up Python for Feast live connectivity check
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras

      - name: Verify Feast schema creation and SQL registry connection against live Postgres & Redis
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password_do_not_use_in_prod
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: logistics
          REDIS_URL: redis://localhost:6379/0
        run: |
          uv run python -u scripts/verify_live_feast_smoke.py

      - name: Verify Live Redpanda Topic Provisioning and Trip Replay Stream
        env:
          REDPANDA_BROKER: localhost:9092
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password_do_not_use_in_prod
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: logistics
        run: |
          uv run python -u scripts/verify_replay_live_stream.py

      - name: Verify Live Redpanda External Feeds Streaming (Traffic, Transit, Weather)
        env:
          REDPANDA_BROKER: localhost:9092
        run: |
          uv run python -u scripts/verify_live_feeds_stream.py

      - name: Inspect container logs
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --env-file .env.ci logs

      - name: Tear down services
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --env-file .env.ci down -v

