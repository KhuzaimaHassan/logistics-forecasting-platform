[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "logistics-forecasting-platform"
version = "0.1.0"
description = "Real-time NYC taxi demand & ETA forecasting platform with LangGraph Ops Copilot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Khuzaima Hassan" }
]
dependencies = []

[project.optional-dependencies]
core = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

extract = [
    "feast>=0.37.0",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]
transform = [
    "kafka-python-ng>=2.2.0",
    "feast>=0.37.0",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]
training = [
    "feast>=0.37.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "mlflow>=2.11.0",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]
serving = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "feast>=0.37.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "mlflow>=2.11.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "faiss-cpu>=1.8.0",
]
monitoring = [
    "evidently>=0.4.15",
    "prefect>=3.0.0",
    "pandas>=2.2.0",
]
orchestration = [
    "prefect>=3.0.0",
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
]
ui = [

    "streamlit>=1.32.0",
    "requests>=2.31.0",
    "pydeck>=0.9.0",
    "pandas>=2.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line length handled by black
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
